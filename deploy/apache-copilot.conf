# Add inside the existing <VirtualHost *:443> for kafka.djaxbidder.com.
# Needs: sudo a2enmod proxy proxy_http headers && sudo systemctl reload apache2
# The trailing slashes matter: /copilot/chat is passed to the app as /chat.

RedirectMatch 301 ^/copilot$ /copilot/
ProxyPreserveHost On
ProxyPass        /copilot/ http://127.0.0.1:8000/ timeout=180
ProxyPassReverse /copilot/ http://127.0.0.1:8000/
<Location /copilot/>
    RequestHeader set X-Forwarded-Proto "https"
    # The app scopes its session cookie to this path (keep it equal to the paths above).
    RequestHeader set X-Forwarded-Prefix "/copilot"
</Location>
