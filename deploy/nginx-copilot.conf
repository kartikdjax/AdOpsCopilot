# Add inside the existing HTTPS server block for kafka.djaxbidder.com, e.g.
#   server { listen 443 ssl; server_name kafka.djaxbidder.com; ...  <here>  }
# then: sudo nginx -t && sudo systemctl reload nginx
# The trailing slashes matter: /copilot/chat is passed to the app as /chat.

location = /copilot {
    return 301 /copilot/;
}

location /copilot/ {
    proxy_pass http://127.0.0.1:8000/;      # COPILOT_PORT in deploy/.env
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /copilot;   # the app scopes its session cookie to this path
    proxy_read_timeout 180s;                # LLM answers can take a while
    client_max_body_size 1m;
}
